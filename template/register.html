<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | ServiceDesk Plus</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-field { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .input-field:focus { background: rgba(255, 255, 255, 0.1); border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .input-field::placeholder { color: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    {% include 'toast.html' %}

    <div class="glass-card w-full max-w-md rounded-2xl p-8 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/20 text-indigo-400 mb-4">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">Створити акаунт</h2>
            <p class="text-gray-400 text-sm">Приєднуйтесь до ServiceDesk Plus</p>
        </div>

        {% if error %}
            <div class="mb-4 p-3 rounded-lg text-sm relative z-10 bg-red-500/20 text-red-300 border border-red-500/30">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/auth/register" class="space-y-4 relative z-10">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Логін</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-user text-gray-500"></i></div>
                    <input type="text" name="username" required class="input-field w-full pl-10 pr-3 py-3 rounded-lg text-sm" placeholder="Ваш логін">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Електронна пошта</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-envelope text-gray-500"></i></div>
                    <input type="email" name="email" required class="input-field w-full pl-10 pr-3 py-3 rounded-lg text-sm" placeholder="you@example.com">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Номер телефону</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-phone text-gray-500"></i></div>
                    <input type="tel" name="phone_number" required class="input-field w-full pl-10 pr-3 py-3 rounded-lg text-sm" placeholder="+380 (XX) XXX-XX-XX">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Пароль</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-lock text-gray-500"></i></div>
                    <input type="password" name="password" required class="input-field w-full pl-10 pr-3 py-3 rounded-lg text-sm" placeholder="••••••••">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Підтвердіть пароль</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-lock text-gray-500"></i></div>
                    <input type="password" name="confirm_password" required class="input-field w-full pl-10 pr-3 py-3 rounded-lg text-sm" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-all duration-300 transform hover:scale-[1.02] shadow-lg shadow-indigo-500/30 flex justify-center items-center gap-2">
                <span>Зареєструватися</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-400 relative z-10">
            Вже є акаунт? <a href="/auth/login" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Увійти</a>
        </p>
    </div>
</body>
</html>
