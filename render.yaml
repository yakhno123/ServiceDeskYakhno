services:
  - type: web
    name: servicedesk-plus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_PATH
        value: /var/data/project.db
      - key: SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    disk:
      name: servicedesk-data
      mountPath: /var/data
      sizeGB: 1